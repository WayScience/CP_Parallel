name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Kept in sync with `[tool.uv] environments` in pyproject.toml: the dev
        # dependency group (pytest, pre-commit, ...) only resolves on these
        # versions. Compatibility with CellProfiler's own (older) Python, down to
        # the package's real `requires-python` floor, is covered by the
        # `compat` job below instead, via a plain `pip install` with no dev deps.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest --cov=cp_parallel --cov-report=term-missing

  compat:
    # Smoke-tests that the published package itself -- no dev tooling -- still
    # installs and imports on the older Python versions that real CellProfiler
    # conda environments commonly run (e.g. CellProfiler 4.x on Python 3.8).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package (no dev dependencies)
        run: pip install .
      - name: Import sanity check
        run: python -c "import cp_parallel; print(cp_parallel.run_parallel)"
