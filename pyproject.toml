[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cp_parallel"
version = "0.1.0"
description = "Run CellProfiler headless in parallel across plates or wells."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
authors = [{ name = "Way Science" }]

[project.urls]
Repository = "https://github.com/WayScience/CP_Parallel"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# `requires-python` above (>=3.8) is what the *published package* supports at
# runtime -- it has to, since that's what real CellProfiler conda environments
# run. The dev tooling below (pre-commit, etc.) needs a newer interpreter, so
# restrict uv's own lockfile resolution to that, independent of `requires-python`.
environments = ["python_version >= '3.10'"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# E4/E7/E9 (not the full "E", which also includes the line-length check E501 --
# redundant with, and sometimes in tension with, the `ruff format` line wrapping).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
