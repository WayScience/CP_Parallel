[build-system]
# setuptools-scm derives the version from git tags (see `[tool.setuptools_scm]`).
# Floors are kept low on purpose: pip builds this package with the *user's*
# interpreter, and newer setuptools drops old Pythons (75.4+ needs >=3.9, 83+
# needs >=3.10), which would break `pip install git+...` in CellProfiler envs.
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cp_parallel"
dynamic = ["version"]
description = "Run CellProfiler headless in parallel across plates or wells."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
authors = [{ name = "Way Science" }]

[project.urls]
Repository = "https://github.com/WayScience/CP_Parallel"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

[tool.setuptools_scm]
# Version comes from the latest `vX.Y.Z` git tag -- release by tagging, no code
# change needed. Untagged commits get e.g. `0.2.1.dev3+g1a2b3c4`. The fallback
# only applies when building without git metadata (e.g. a GitHub source zip).
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# `requires-python` above (>=3.8) is what the *published package* supports at
# runtime -- it has to, since that's what real CellProfiler conda environments
# run. The dev tooling below (pre-commit, etc.) needs a newer interpreter, so
# restrict uv's own lockfile resolution to that, independent of `requires-python`.
environments = ["python_version >= '3.10'"]

[tool.ty.environment]
# Type-check against the package's runtime floor (see `requires-python`), so ty
# flags any stdlib/typing API that wouldn't exist in a CellProfiler env.
python-version = "3.8"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# E4/E7/E9 (not the full "E", which also includes the line-length check E501 --
# redundant with, and sometimes in tension with, the `ruff format` line wrapping).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
